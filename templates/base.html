<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Candidate Intelligence Agent{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c5c6cd",
                        "surface": "#fbf8fa",
                        "surface-container": "#f0edef",
                        "on-background": "#1b1b1d",
                        "surface-container-low": "#f5f3f4",
                        "inverse-surface": "#303032",
                        "surface-container-high": "#eae7e9",
                        "background": "#fbf8fa",
                        "tertiary": "#1e1200",
                        "on-tertiary-fixed": "#271902",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f3f0f2",
                        "surface-dim": "#dcd9db",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#fffbff",
                        "on-surface-variant": "#45474c",
                        "on-tertiary-container": "#a38c6a",
                        "tertiary-fixed-dim": "#ddc39d",
                        "primary": "#091426",
                        "primary-container": "#1e293b",
                        "on-tertiary-fixed-variant": "#564427",
                        "on-secondary-fixed": "#0f0069",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e4e2e3",
                        "outline": "#75777d",
                        "primary-fixed": "#d8e3fb",
                        "surface-tint": "#545f73",
                        "on-primary-fixed-variant": "#3c475a",
                        "surface-container-highest": "#e4e2e3",
                        "tertiary-container": "#35260c",
                        "on-error-container": "#93000a",
                        "on-surface": "#1b1b1d",
                        "primary-fixed-dim": "#bcc7de",
                        "on-primary-container": "#8590a6",
                        "on-primary-fixed": "#111c2d",
                        "surface-bright": "#fbf8fa",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#3c475a",
                        "surface-container-highest": "#e4e2e3",
                        "tertiary-container": "#35260c",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "inverse-primary": "#bcc7de",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#645efb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "unit": "4px",
                        "container-max": "1280px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "40px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="min-h-screen flex flex-col bg-background">
    <nav class="bg-surface dark:bg-on-background flex justify-between items-center h-16 px-md md:px-xl max-w-container-max mx-auto w-full border-b border-outline-variant dark:border-outline docked full-width top-0 z-50 sticky">
        <div class="flex items-center gap-sm">
            <span class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed tracking-tight">Candidate Intelligence Agent</span>
        </div>
        <div class="hidden md:flex items-center gap-lg">
            <button class="font-label-md text-label-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors duration-200">History</button>
            <button class="font-label-md text-label-md text-primary dark:text-primary-fixed border-b-2 border-primary dark:border-primary-fixed pb-1 hover:text-primary dark:hover:text-primary-fixed transition-colors duration-200 opacity-80 transition-opacity" onclick="resetApp()">New Investigation</button>
            <button class="text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors duration-200 flex items-center justify-center">
                <span class="material-symbols-outlined text-[24px]">account_circle</span>
            </button>
        </div>
    </nav>
    
    <main class="flex-grow w-full max-w-container-max mx-auto px-md md:px-lg py-xl">
        {% csrf_token %}
        {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-surface-container dark:bg-surface-container-high border-t border-outline-variant dark:border-outline full-width mt-auto">
        <div class="flex flex-col md:flex-row justify-between items-center py-lg px-md max-w-container-max mx-auto w-full gap-md transition-all duration-200">
            <span class="font-label-md text-label-md font-bold text-on-surface dark:text-surface-bright">© 2026 Candidate Intelligence Agent. Confidential &amp; Secure.</span>
            <div class="flex gap-md">
                <a class="font-label-sm text-label-sm text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#" target="_blank">Privacy Policy</a>
                <a class="font-label-sm text-label-sm text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#" target="_blank">Terms of Service</a>
                <a class="font-label-sm text-label-sm text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#" target="_blank">Security Architecture</a>
            </div>
        </div>
    </footer>
    
    <div id="toast-container"></div>
    
    <script src="{% static 'js/app.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
