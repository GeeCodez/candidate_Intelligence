<section class="max-w-5xl mx-auto" id="state-results">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-lg gap-md">
        <div>
            <h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Requirements Evaluation</h1>
            <p class="font-body-md text-body-md text-on-surface-variant" id="results-subtitle">Analysis complete</p>
        </div>
        <div class="flex gap-md">
            <button class="btn-primary rounded-lg px-md py-sm font-label-md text-label-md font-semibold flex items-center gap-sm" id="verify-all-btn" onclick="verifyAllClaims()" style="display: none;">
                <span class="material-symbols-outlined text-[18px]">verified</span>
                Verify All Claims
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-md mb-xl">
        <div class="bg-surface-container-lowest border border-surface-variant rounded-DEFAULT p-md flex flex-col">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-xs">Requirements</span>
            <span class="font-headline-md text-headline-md text-primary" id="stat-requirements">0</span>
        </div>
        <div class="bg-surface-container-lowest border border-surface-variant rounded-DEFAULT p-md flex flex-col">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-xs">Claims</span>
            <span class="font-headline-md text-headline-md text-primary" id="stat-met" style="color: #6366f1;">0</span>
        </div>
        <div class="bg-surface-container-lowest border border-surface-variant rounded-DEFAULT p-md flex flex-col">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-xs">Sources</span>
            <span class="font-headline-md text-headline-md text-primary" id="stat-partial" style="color: #0891b2;">0</span>
        </div>
    </div>

    <div class="bg-surface-container-lowest border border-surface-variant rounded-lg overflow-hidden shadow-sm">
        <div class="grid grid-cols-12 gap-md p-md border-b border-surface-variant bg-surface-container-lowest font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider hidden md:grid">
            <div class="col-span-4">Requirement</div>
            <div class="col-span-4">Candidate Claim</div>
            <div class="col-span-2">Importance</div>
            <div class="col-span-2 text-right">Status</div>
        </div>
        <div class="flex flex-col" id="requirements-list">
            <p class="p-md font-body-md text-body-md text-on-surface-variant">No requirements evaluated yet.</p>
        </div>
    </div>
</section>
